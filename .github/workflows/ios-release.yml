name: iOS Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза, например 1.2.0; пусто — MARKETING_VERSION из project.yml"
        required: false
        type: string
      create_release:
        description: "Создать GitHub Release после сборки"
        required: true
        default: true
        type: boolean
      prerelease:
        description: "Пометить релиз как предварительный"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app
          xcodegen generate

      - name: Resolve build version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          project_version="$(awk '/MARKETING_VERSION:/ {gsub(/"/, "", $2); print $2; exit}' project.yml)"

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            app_version="${GITHUB_REF_NAME#v}"
          elif [[ -n "${REQUESTED_VERSION:-}" ]]; then
            app_version="${REQUESTED_VERSION#v}"
          else
            app_version="$project_version"
          fi

          if [[ ! "$app_version" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Invalid release version: $app_version" >&2
            exit 1
          fi

          marketing_version="${app_version%%-*}"
          if [[ ! "$marketing_version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            marketing_version="$project_version"
          fi

          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"
          echo "MARKETING_VERSION=$marketing_version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "Building Museeks $app_version ($GITHUB_RUN_NUMBER)"

      - name: Build application for iPhone
        run: |
          xcodebuild clean build \
            -project Museeks.xcodeproj \
            -scheme Museeks \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Package unsigned IPA
        run: |
          app_path="build/DerivedData/Build/Products/Release-iphoneos/Museeks.app"
          if [[ ! -d "$app_path" ]]; then
            echo "Museeks.app was not produced at $app_path" >&2
            find build/DerivedData/Build/Products -maxdepth 3 -type d -name "*.app" -print
            exit 1
          fi

          package_root="$RUNNER_TEMP/museeks-package"
          mkdir -p "$package_root/Payload" "$GITHUB_WORKSPACE/dist"
          ditto "$app_path" "$package_root/Payload/Museeks.app"

          ipa_name="Museeks-${APP_VERSION}-${BUILD_NUMBER}-unsigned.ipa"
          ditto -c -k --sequesterRsrc --keepParent \
            "$package_root/Payload" \
            "$GITHUB_WORKSPACE/dist/$ipa_name"

          cd "$GITHUB_WORKSPACE/dist"
          shasum -a 256 "$ipa_name" > "$ipa_name.sha256"
          ls -lh "$ipa_name" "$ipa_name.sha256"

      # Create the release directly from the packaged IPA in this job's build
      # folder — no GitHub Actions artifact staging, so a full artifact store
      # can never block publishing. Runs on every non-PR event (tag push,
      # push to main, workflow_dispatch) so the step is never skipped; the
      # release tag is derived and updated in place, not duplicated.
      - name: Create or update GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            version="${REQUESTED_VERSION:-}"
            if [[ -z "$version" ]]; then
              version="$APP_VERSION"
            fi
            version="${version#v}"
            tag="v$version"
          fi

          prerelease="${REQUESTED_PRERELEASE:-false}"
          if [[ "$tag" == *-* ]]; then
            prerelease="true"
          fi

          mapfile -t assets < <(find dist -maxdepth 1 -type f \( -name "*.ipa" -o -name "*.sha256" \) -print | sort)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "::warning::No IPA found in dist/; creating release without assets."
          else
            echo "Attaching ${#assets[@]} release asset(s)"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            if [[ ${#assets[@]} -gt 0 ]]; then
              gh release upload "$tag" "${assets[@]}" --clobber
            fi
            exit 0
          fi

          args=(
            release create "$tag"
            --target "$GITHUB_SHA"
            --title "Museeks $tag"
            --generate-notes
          )
          if [[ ${#assets[@]} -gt 0 ]]; then
            args+=( "${assets[@]}" )
          fi
          if [[ "$prerelease" == "true" ]]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest)
          fi
          gh "${args[@]}"
